services:
  # 1. Base de données (Interne uniquement)
  db:
    image: postgres:15-alpine
    container_name: resilience_db
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: supersecret_db_password
      POSTGRES_DB: payment_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal_net
    restart: unless-stopped

  # 2. HashiCorp Vault - Gestion des secrets (Interne uniquement)
  vault:
    image: hashicorp/vault:1.15
    container_name: resilience_vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "resilience-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - internal_net
    restart: unless-stopped

  # 3. Microservice d'Authentification
  auth-service:
    build: ./auth-service
    container_name: resilience_auth
    environment:
      JWT_SECRET: "cle-secrete-jwt-resilience-2026"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "resilience-root-token"
    networks:
      - internal_net
    depends_on:
      - vault
    restart: unless-stopped

  # 4. API Métier de Paiement
  payment-api:
    build: ./payment-api
    container_name: resilience_payment_api
    environment:
      DATABASE_URL: "postgresql://payment_user:supersecret_db_password@db:5432/payment_db"
      AUTH_SERVICE_URL: "http://auth-service:8000"
    networks:
      - internal_net
    depends_on:
      - db
      - auth-service
    restart: unless-stopped

  # 5. WAF / Reverse Proxy (Point d'entrée exposé au réseau du groupe)
  waf:
    image: nginx:alpine
    container_name: resilience_waf
    ports:
      - "80:80"
    volumes:
      - ./waf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - waf_logs:/var/log/nginx
    networks:
      - internal_net
    depends_on:
      - payment-api
      - auth-service
    restart: unless-stopped

  # 6. Frontal Web & Dashboard Supervision (React + Tailwind)
  frontend:
    build: ./frontend
    container_name: resilience_frontend
    ports:
      - "8080:80"
    networks:
      - internal_net
    restart: unless-stopped

  # 7. Observabilité : Prometheus (Métriques)
  prometheus:
    image: prom/prometheus:latest
    container_name: resilience_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - internal_net
    restart: unless-stopped

  # 8. Observabilité : Loki (Centralisation des journaux)
  loki:
    image: grafana/loki:2.9.2
    container_name: resilience_loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal_net
    restart: unless-stopped

  # 9. Observabilité : Grafana (Visualisation)
  grafana:
    image: grafana/grafana:latest
    container_name: resilience_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal_net
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # 10. Moteur de Remédiation Automatisée (Ansible + Journal SIEM)
  remediation-engine:
    build: ./remediation-engine
    container_name: resilience_remediation
    ports:
      - "8090:8000"
    networks:
      - internal_net
    depends_on:
      - payment-api
    restart: unless-stopped

  # 11. Détecteur d'anomalies Machine Learning (Isolation Forest)
  ml-detector:
    build: ./ml-detector
    container_name: resilience_ml_detector
    networks:
      - internal_net
    depends_on:
      - payment-api
      - remediation-engine
    restart: unless-stopped

  # 12. Collecteur de journaux vers Loki (Promtail)
  promtail:
    image: grafana/promtail:2.9.2
    container_name: resilience_promtail
    volumes:
      - waf_logs:/var/log/nginx:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - internal_net
    depends_on:
      - loki
    restart: unless-stopped

  # 13. Serveur LLM Local Ollama (Modèle <= 8B paramètres)
  ollama:
    image: ollama/ollama:latest
    container_name: resilience_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal_net
    restart: unless-stopped

  # 14. Assistant IA Opérateur (RAG LangChain + Ollama)
  rag-assistant:
    build: ./rag-assistant
    container_name: resilience_rag
    ports:
      - "8095:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
    networks:
      - internal_net
    depends_on:
      - ollama
    restart: unless-stopped

networks:
  internal_net:
    driver: bridge

volumes:
  db_data:
  waf_logs:
  ollama_data:
